    const GOOGLE_APPS_SCRIPT_LALAI = "https://script.google.com/macros/s/AKfycbx97ZbqBdeMacuSRSC7FYGC45gPyw5G-vS-r0xSOfWTEcBGR2zdefFn9wfd9HU6MmDC_g/exec";

    const fetchQueue = [];
    let isFetchingGAS = false;

    async function fetchFromGAS(url, payload) {
      return new Promise((resolve, reject) => {
        fetchQueue.push(async () => {
          try {
            const response = await fetch(url, {
              method: "POST",
              redirect: "follow",
              headers: {
                "Content-Type": "text/plain;charset=utf-8",
              },
              body: JSON.stringify(payload)
            });
            const data = await response.json();
            resolve(data);
          } catch (e) {
            reject(e);
          }
        });
        processGASQueue();
      });
    }

    async function processGASQueue() {
      if (isFetchingGAS || fetchQueue.length === 0) return;
      isFetchingGAS = true;
      try {
        const task = fetchQueue.shift();
        await task();
      } finally {
        isFetchingGAS = false;
        processGASQueue();
      }
    }

    const WORLD_COUNTRIES = [

    const SECTORS_LIST = [
      { id: "og", name: "1. Minyak & Gas (Oil & Gas)" },
      { id: "perkhidmatan", name: "2. Perkhidmatan" },
      { id: "kerajaan", name: "3. Kerajaan" },

    function cleanText(text) {
      if (!text || typeof text !== 'string') return text ? String(text).trim() : '';
      let cleaned = text.replace(/\\n/g, '\n').replace(/\r/g, '');
      return cleaned.trim();
    }

    function getSectorDisplayName(sectorId) {
      if (sectorId === "og") return "MINYAK & GAS";
      const found = SECTORS_LIST.find(s => s.id === sectorId);
      if (found) {
        return found.name.replace(/^\d+\.\s*/, "").toUpperCase();
      }
      return (sectorId || "").toUpperCase();
    }

    function getSheetName(meetingNumber, meetingYear, officerName, sectorId) {
      const cleanOfficer = (officerName || "").trim() ? ` (${(officerName || "").trim().toUpperCase()})` : '';
      let sectorSuffix = "";
      if (sectorId === "og") sectorSuffix = " O&G";
      else if (sectorId === "perkhidmatan") sectorSuffix = " PERKHIDMATAN";
      else if (sectorId === "kerajaan") sectorSuffix = " KERAJAAN";
      else if (sectorId === "lanjutan") sectorSuffix = " LANJUTAN";
      else if (sectorId === "kelulusan_dasar") sectorSuffix = " KELULUSAN DASAR";
      
      return `Bil. ${meetingNumber}/${meetingYear}${cleanOfficer}${sectorSuffix}`;
    }

    function normalizePenyandang(p) {
      if (!p) return {};
      const getVal = (obj, keys) => {
        for (let key of keys) {
          if (obj[key] !== undefined && obj[key] !== null) {
            return cleanText(obj[key].toString());
          }
        }
        return undefined;
      };

      return {
        nama: getVal(p, ['nama', 'NAMA', 'Nama', 'namaPenyandang', 'nama_penuh', 'NAMA_PENUH']) || '',
        jantina: getVal(p, ['jantina', 'JANTINA', 'Jantina']) || 'L',
        warganegara: getVal(p, ['warganegara', 'WARGANEGARA', 'Warganegara', 'wn', 'WN', 'Wn', 'warganegara_code', 'WARGANEGARA_CODE']) || '',
        pasport: getVal(p, ['pasport', 'PASPORT', 'Pasport', 'passport', 'PASSPORT', 'Passport']) || '',
        tarikhLahir: getVal(p, ['tarikhLahir', 'tarikh_lahir', 'TARIKH_LAHIR', 'TarikhLahir', 'tarikh', 'TARIKH']) || '',
        umur: getVal(p, ['umur', 'UMUR', 'Umur', 'umur_penyandang', 'UMUR_PENYANDANG']) || '',
        jawatan: getVal(p, ['jawatan', 'JAWATAN', 'Jawatan', 'jawatan_penyandang', 'JAWATAN_PENYANDANG']) || '',
        gaji: getVal(p, ['gaji', 'GAJI', 'Gaji', 'gaji_bulanan', 'GAJI_BULANAN']) || ''
      };
    }

    function parsePlainPenyandang(text) {
      if (!text) return [];
      const cleanedInput = cleanText(text);
      const lines = cleanedInput.split(/\r?\n/);
      const result = [];

      for (let line of lines) {
        let clean = line.trim();
        if (!clean) continue;

        clean = clean.replace(/^\d+[\.\)\s\-–]*/, '').trim();
        if (!clean) continue;

        const parts = clean.split('/').map(p => p.trim());
        let nama = parts[0] || "";
        let jantina = parts[1] || "L";
        let warganegara = parts[2] || "";
        let pasport = parts[3] || "";
        let rest = parts.slice(4).join(" / ").trim();
        
        let umur = "";
        let jawatan = "";
        let gaji = "";
        let tarikhLahir = "";

        const gajiMatch = rest.match(/GAJI:\s*(RM\s*[0-9,.]+)/i) || rest.match(/(RM\s*[0-9,.]+)/i);
        if (gajiMatch) {
          gaji = gajiMatch[1].trim();
          rest = rest.replace(/GAJI:\s*RM\s*[0-9,.]+/i, "").trim();
          rest = rest.replace(/(RM\s*[0-9,.]+)/i, "").trim();
        }

        const dateMatch = rest.match(/([0-9]{2}\.[0-9]{2}\.[0-9]{4}|[0-9]{2}\/[0-9]{2}\/[0-9]{4}|[0-9]{4}-[0-9]{2}-[0-9]{2})/);
        if (dateMatch) {
          tarikhLahir = dateMatch[1].trim();
          rest = rest.replace(tarikhLahir, "").trim();
        }

        const umurMatch = rest.match(/\((\d+)\s*(?:THN|TAHUN|YEARS?)\)/i) || rest.match(/(\d+)\s*(?:THN|TAHUN|YEARS?)/i);
        if (umurMatch) {
          umur = umurMatch[1].trim() + " THN";
          rest = rest.replace(umurMatch[0], "").trim();
        }

        rest = rest.replace(/\(\s*\)/g, "").trim().replace(/\s+/g, " ");
        let cleanedRest = rest.replace(/^[\s–\-\)]+/, '').replace(/[\s–\-]+$/, '').replace(/^\s*\(\s*/, '').replace(/\s*\)\s*$/, '').trim();
        if (cleanedRest) {
          jawatan = cleanedRest;
        }

        result.push({
          nama, jantina, warganegara, pasport, tarikhLahir, umur, jawatan, gaji
        });
      }

      return result;
    }

    function parseProjectAndDetails(item) {
      const defaultState = { kegiatan: '', projek: [''], noKontrak: '', tempohProjek: '', ownerProjek: '' };
      if (!item) return defaultState;

      let textToParse = item.rawProjectStr;

      if (!textToParse) {
        return {
          kegiatan: typeof item.kegiatan === 'string' ? cleanText(item.kegiatan) : '',
          projek: Array.isArray(item.projek) ? item.projek.filter(p => p.trim() !== '') : (item.projek ? [cleanText(item.projek)] : ['']),
          noKontrak: cleanText(item.noKontrak),
          tempohProjek: cleanText(item.tempohProjek),
          ownerProjek: cleanText(item.ownerProjek)
        };
      }

      let lines = textToParse.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      let currentSection = "K"; 
      let kegiatanLines = [];
      let projekLines = [];
      let nk = "", tp = "", op = "";

      const cleanStr = (str) => str.replace(/^[➢\-\*\s]+/, '').trim();

      for (let line of lines) {
        let cleanLine = cleanStr(line);
        let upperLine = cleanLine.toUpperCase();

        if (!cleanLine) continue;

        if (upperLine.startsWith("KEGIATAN SYARIKAT")) {
          currentSection = "K";
          let val = cleanLine.replace(/^KEGIATAN\s*SYARIKAT\s*:?\s*[➢\-\*]?\s*/i, '').trim();
          if (val) kegiatanLines.push(val);
          continue;
        }
        if (upperLine.startsWith("PROJECT:") || upperLine === "PROJECT") {
          currentSection = "P";
          let val = cleanLine.replace(/^PROJECT\s*:?\s*[➢\-\*]?\s*/i, '').trim();
          if (val) projekLines.push(val);
          continue;
        }

        if (upperLine.startsWith("NO. KONTRAK") || upperLine.startsWith("NO KONTRAK")) {
          let val = cleanLine.replace(/^NO\.?\s*KONTRAK\s*:?\s*[➢\-\*]?\s*/i, '').trim();
          if (val && !nk) nk = val;
          continue;
        }
        if (upperLine.startsWith("TEMPOH PROJEK") || upperLine.startsWith("TEMPOH KONTRAK")) {
          let val = cleanLine.replace(/^TEMPOH\s*(PROJEK|KONTRAK)\s*:?\s*[➢\-\*]?\s*/i, '').trim();
          if (val && !tp) tp = val;
          continue;
        }
        if (upperLine.startsWith("OWNER PROJECT") || upperLine.startsWith("OWNER PROJEK") || upperLine.startsWith("KLIEN")) {
          let val = cleanLine.replace(/^(OWNER\s*PROJE[CK]T|KLIEN)\s*:?\s*[➢\-\*]?\s*/i, '').trim();
          if (val && !op) op = val;
          continue;
        }

        if (nk && upperLine === nk.toUpperCase()) continue;
        if (tp && upperLine === tp.toUpperCase()) continue;
        if (op && upperLine === op.toUpperCase()) continue;

        if (currentSection === "K") {
          kegiatanLines.push(cleanLine);
        } else {
          projekLines.push(cleanLine);
        }
      }

      return {
        kegiatan: [...new Set(kegiatanLines)].join("\n"),
        projek: [...new Set(projekLines)].length > 0 ? [...new Set(projekLines)] : [""],
        noKontrak: nk,
        tempohProjek: tp,
        ownerProjek: op
      };
    }

    function formatPenyandangToPlain(penyandangList) {
      if (!penyandangList || penyandangList.length === 0) return "";
      return penyandangList.map((p, idx) => {
        const norm = normalizePenyandang(p);
        let parts = [norm.nama, norm.jantina, norm.warganegara || "-", norm.pasport || "-"];

        let formattedDate = norm.tarikhLahir || "";
        if (formattedDate.includes("-")) {
          const s = formattedDate.split("-");
          if (s.length === 3 && s[0].length === 4) {
            formattedDate = `${s[2]}.${s[1]}.${s[0]}`;
          }
        }

        let dateAndAge = formattedDate;
        if (norm.umur) {
          dateAndAge += ` (${norm.umur})`;
        } else if (!dateAndAge) {
          dateAndAge = "-";
        }
        parts.push(dateAndAge);

        let mainStr = parts.join(" / ");
        let jawatanStr = norm.jawatan ? ` – ${norm.jawatan}` : "";
        let gajiStr = norm.gaji ? ` GAJI: ${norm.gaji}` : "";

        return `${idx + 1}. ${mainStr}${jawatanStr}${gajiStr}`;
      }).join("\n");
    }

    function processRecordsFromSheet(records) {
      if (!Array.isArray(records)) return [];
      return records.map(r => {
        let parsedPenyandang = [];
        const sourceStr = cleanText((r.rawPenyandangStr || r.penyandang || "").toString());
        
        if (sourceStr) {
          if (sourceStr.startsWith('[') || sourceStr.startsWith('{')) {
            try {
              parsedPenyandang = JSON.parse(sourceStr);
            } catch(e) {
              parsedPenyandang = parsePlainPenyandang(sourceStr);
            }
          } else {
            parsedPenyandang = parsePlainPenyandang(sourceStr);
          }
        }

        let cleanComp = cleanText(r.namaSyarikat);
        let cleanAddr = cleanText(r.alamat);
        if (cleanComp.includes('\n') && !cleanAddr) {
          const parts = cleanComp.split('\n');
          cleanComp = parts[0].trim();
          cleanAddr = parts.slice(1).join('\n').trim();
        }

        const parsed = parseProjectAndDetails(r);

        return {
          ...r,
          namaSyarikat: cleanComp,
          alamat: cleanAddr,
          kegiatan: parsed.kegiatan,
          projek: parsed.projek,
          noKontrak: parsed.noKontrak,
          tempohProjek: parsed.tempohProjek,
          ownerProjek: parsed.ownerProjek,
          penyandang: parsedPenyandang.map(normalizePenyandang),
          ulasan: cleanText(r.ulasan)
        };
      });
    }

    function calculateBAndWN(penyandangList) {
      if (!penyandangList || penyandangList.length === 0) {
        return { valB: "01", valWN: "-" };
      }

      const totalPenyandang = penyandangList.length;
      const formattedB = totalPenyandang < 10 ? `0${totalPenyandang}` : `${totalPenyandang}`;

      const group = {};
      penyandangList.forEach(p => {
        const normalized = normalizePenyandang(p);
        const wn = (normalized.warganegara || "").trim().toUpperCase();
        const passport = (normalized.pasport || "").trim();
        
        let displayWN = wn;
        if (wn === "MYS" && passport.length > 0) {
          const code = passport.charAt(0).toUpperCase();
          displayWN = `MYS '${code}'`;
        }

        group[displayWN] = (group[displayWN] || 0) + 1;
      });

      const wnRows = Object.keys(group).map(key => {
        const count = group[key];
        const formattedCount = count < 10 ? `0${count}` : `${count}`;
        return `${formattedCount} ${key}`;
      });

      return {
        valB: formattedB,
        valWN: wnRows.join("\n")
      };
    }

    function formatWithBullets(textOrArray) {
      if (Array.isArray(textOrArray)) {
        let valid = textOrArray.filter(t => t && String(t).trim() !== "");
        if (valid.length === 0) return "-";
        return valid.map(t => String(t).replace(/^[➢\-\*\s]+/, '').trim()).join("\n➢ ");
      }
      if (!textOrArray || String(textOrArray).trim() === "") return "-";
      let lines = String(textOrArray).split(/\r?\n/).filter(t => t.trim() !== "");
      return lines.map(t => t.replace(/^[➢\-\*\s]+/, '').trim()).join("\n➢ ");
    }

    function formatDateForInput(dateStr) {
      if (!dateStr) return "";
      if (dateStr.includes("-") && dateStr.split("-")[0].length === 4) return dateStr;
      const parts = dateStr.split(/[\.\/]/);
      if (parts.length === 3 && parts[2].length === 4) {
        return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
      }
      return dateStr;
    }

    function prepareRecordForSync(item) {
      return {
        ...item,
        namaSyarikat: cleanText(item.namaSyarikat),
        alamat: cleanText(item.alamat),
        kegiatan: formatWithBullets(item.kegiatan),
        projek: formatWithBullets(item.projek),
        noKontrak: cleanText(item.noKontrak) || "-",
        tempohProjek: cleanText(item.tempohProjek) || "-",
        ownerProjek: cleanText(item.ownerProjek) || "-",
        penyandang: formatPenyandangToPlain(item.penyandang)
      };
    }

      function showToast(message, type = "info") {
        const id = Date.now();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, 4000);
      }

      function addLog(message, type = "info") {
        const timestamp = new Date().toLocaleTimeString();
        setSyncLogs(prev => [{ timestamp, message, type }, ...prev.slice(0, 19)]);
      }

      async function handleLogin(e) {
        if (e) e.preventDefault();
        setLoginError("");
        setLoginLoading(true);

        try {
          const res = await fetchFromGAS(sheetUrl, {
            action: "login",
            username: loginUsername,
            password: loginPassword
          });

          if (res.status === "success" && res.user) {
            setCurrentUser(res.user);
            setOfficerName(res.user.officerName);
            localStorage.setItem("jkplik_active_user", JSON.stringify(res.user));
            showToast(`Selamat kembali, Pegawai ${res.user.officerName}!`, "success");
          } else {
            setLoginError(res.message || "ID Pengguna atau Kata Laluan tidak sah.");
          }
        } catch (err) {
          setLoginError("Gagal menyambung ke pelayan Google Apps Script. Sila semak sambungan internet anda.");
        } finally {
          setLoginLoading(false);
        }
      }

      function handleLogout() {
        setConfirmModal({
          show: true,
          message: "Adakah anda pasti untuk log keluar daripada sistem?",
          action: () => {
            setCurrentUser(null);
            setOfficerName("");
            localStorage.removeItem("jkplik_active_user");
            setSessionData({});
            setConfirmModal({ show: false, action: null, message: "" });
            showToast("Anda telah berjaya log keluar.", "info");
          }
        });
      }

      async function handleChangePassword(e) {
        e.preventDefault();
        setPasswordMessage({ text: "", type: "" });

        if (newPasswordInput !== confirmPasswordInput) {
          setPasswordMessage({ text: "Kata laluan baharu dan pengesahan tidak sepadan.", type: "error" });
          return;
        }

        if (newPasswordInput.length < 5) {
          setPasswordMessage({ text: "Kata laluan baharu mestilah sekurang-kurangnya 5 aksara.", type: "error" });
          return;
        }

        setPasswordLoading(true);
        try {
          const res = await fetchFromGAS(sheetUrl, {
            action: "change_password",
            username: currentUser.username,
            oldPassword: oldPasswordInput,
            newPassword: newPasswordInput
          });

          if (res.status === "success") {
            setPasswordMessage({ text: res.message, type: "success" });
            setOldPasswordInput("");
            setNewPasswordInput("");
            setConfirmPasswordInput("");
            showToast("Kata laluan berjaya dikemaskini!", "success");
          } else {
            setPasswordMessage({ text: res.message || "Gagal mengemaskini kata laluan.", type: "error" });
          }
        } catch (err) {
          setPasswordMessage({ text: "Ralat sambungan: " + err.message, type: "error" });
        } finally {
          setPasswordLoading(false);
        }
      }

      async function handleRegisterNewUser(e) {
        e.preventDefault();
        setRegMessage({ text: "", type: "" });

        if (!newRegUsername || !newRegPassword || !newRegOfficerName) {
          setRegMessage({ text: "Sila lengkapkan semua maklumat pengguna.", type: "error" });
          return;
        }

        setRegLoading(true);
        try {
          const res = await fetchFromGAS(sheetUrl, {
            action: "add_user",
            newUsername: newRegUsername,
            newPassword: newRegPassword,
            newOfficerName: newRegOfficerName,
            newRole: newRegRole,
            role: currentUser.role
          });

          if (res.status === "success") {
            setRegMessage({ text: res.message, type: "success" });
            showToast(res.message, "success");
            setNewRegUsername("");
            setNewRegPassword("");
            setNewRegOfficerName("");
            setNewRegRole("Pegawai Penilai");

          } else {
            setRegMessage({ text: res.message || "Gagal menambah pengguna baharu.", type: "error" });

          setRegMessage({ text: "Ralat: " + err.message, type: "error" });
        } finally {
          setRegLoading(false);
        }
      }

      async function fetchSystemUsersList() {
        if (!currentUser || currentUser.role !== "Admin") return;
        setLoadingUsersList(true);
        try {
          const res = await fetchFromGAS(sheetUrl, {
            action: "get_users_list",
            role: currentUser.role
          });
          if (res.status === "success") {
            setSystemUsersList(res.users || []);
          }
        } catch (err) {
          addLog("Gagal memuat senarai pengguna: " + err.message, "error");
        } finally {
          setLoadingUsersList(false);
        }
      }

      function markAsSynced(id, status) {
        setSessionData(prev => {
          const currentSlice = prev[activeCacheKey] || { og: [], others: {} };
          const currentOg = currentSlice.og || [];
          const currentOthers = currentSlice.others || {};

          const updatedOg = currentOg.map(item => (id === null || item.id === id) ? { ...item, synced: status } : item);
          const updatedOthers = {};
          SECTORS_LIST.forEach(s => {
            if (s.id !== "og") {
              updatedOthers[s.id] = (currentOthers[s.id] || []).map(item => (id === null || item.id === id) ? { ...item, synced: status } : item);
            }
          });

          return {
            ...prev,
            [activeCacheKey]: {
              og: updatedOg,
              others: updatedOthers
            }
          };
        });
      }

        normalizedItem.ownerProjek = parsed.ownerProjek;
        normalizedItem.sectorCode = normalizedItem.sectorCode || activeSector;
        
        setEditingCompany(normalizedItem);

        const birthYear = new Date(dateStr).getFullYear();

        setNewPenyandang(prev => ({
          ...prev,
          tarikhLahir: dateStr,
          umur: `${age} THN`
        }));
      }

        const age = currentYear - birthYear;
        setEditPenyandang(prev => ({

      function addPenyandangToEditingCompany() {
        if (!editPenyandang.nama) {
          showToast("Sila masukkan nama penyandang terlebih dahulu.", "error");
          return;
        }
        setEditingCompany(prev => {
          if (!prev) return prev;
          let updatedPenyandang = [...(prev.penyandang || [])];
          if (editingEditCompanyPenyandangIndex !== null) {
            updatedPenyandang[editingEditCompanyPenyandangIndex] = editPenyandang;
          } else {
            updatedPenyandang.push(editPenyandang);
          }
          const { valB, valWN } = calculateBAndWN(updatedPenyandang);
          return {
            ...prev,
            penyandang: updatedPenyandang,
            valB,
            valWN
          };
        });
        setEditPenyandang({
          nama: "", jantina: "L", warganegara: "", pasport: "", tarikhLahir: "", umur: "", jawatan: "", gaji: ""
        });
        setEditNationalityQuery("");
        setEditApplicantSearchQuery("");
        setEditingEditCompanyPenyandangIndex(null);
        showToast(editingEditCompanyPenyandangIndex !== null ? "Penyandang dikemaskini." : "Penyandang ditambah ke draf.", "info");

        setEditingEditCompanyPenyandangIndex(idx);

      function removePenyandangFromEditingCompany(idx) {
        if (editingEditCompanyPenyandangIndex !== null) {
          cancelEditEditingPenyandang();
        }
        setEditingCompany(prev => {
          if (!prev) return prev;
          const filtered = (prev.penyandang || []).filter((_, i) => i !== idx);
          const { valB, valWN } = calculateBAndWN(filtered);
          return {
            ...prev,
            penyandang: filtered,
            valB,
            valWN
          };
        });
        showToast("Penyandang dipadam daripada draf.", "info");
      }

      function handleUpdateCompany(e) {
        e.preventDefault();
        if (!editingCompany) return;

        setSessionData(prev => {
          const currentSlice = prev[activeCacheKey] || { og: [], others: {} };
          const currentOg = currentSlice.og || [];
          const currentOthers = currentSlice.others || {};

          let updatedOg = [...currentOg];
          let updatedOthers = { ...currentOthers };
          const targetSector = editingCompany.sectorCode || activeSector;

          if (targetSector === "og") {
            updatedOg = currentOg.map(item => item.id === editingCompany.id ? editingCompany : item);
          } else {
            updatedOthers[targetSector] = (currentOthers[targetSector] || []).map(item => item.id === editingCompany.id ? editingCompany : item);
          }

          if (sheetUrl) {
            const targetListForSync = targetSector === "og" ? updatedOg : (updatedOthers[targetSector] || []);
            setTimeout(() => {
              syncEditRowToGoogleSheets(editingCompany, targetListForSync, targetSector);
            }, 0);
          }

          return {
            ...prev,
            [activeCacheKey]: {
              og: updatedOg,
              others: updatedOthers
            }
          };
        });

        showToast(`Permohonan ${editingCompany.namaSyarikat} berjaya dikemaskini!`, "success");
        setShowEditModal(false);
        setEditingCompany(null);

      async function loadCurrentMeetingFromSheets() {
        if (!sheetUrl || !currentUser) return;
        
        const baseName = `Bil. ${meetingNumber}/${meetingYear}${officerName.trim() ? ` (${officerName.trim().toUpperCase()})` : ''}`;
        addLog(`[AUTO-SYNC] Menyemak helaian milik "${officerName}" bagi Bil. ${meetingNumber}/${meetingYear}...`, "info");
        
        try {
          const listResult = await fetchFromGAS(sheetUrl, { 
            action: "get_sheets_list",
            officerName: officerName,
            role: currentUser.role
          });
          
          if (listResult.status === "success") {
            const sheetsToLoad = listResult.sheets.filter(sh => sh.startsWith(baseName));
            
            if (sheetsToLoad.length > 0) {
              addLog(`[AUTO-SYNC] Ditemui ${sheetsToLoad.length} helaian sektor milik anda. Memuat turun data...`, "info");
              
              const fetchPromises = sheetsToLoad.map(shName => 
                fetchFromGAS(sheetUrl, { 
                  action: "load_sheet_data", 
                  sheetName: shName,
                  officerName: officerName,
                  role: currentUser.role
                })
              );
              
              const results = await Promise.all(fetchPromises);
              let allRecords = [];
              
              results.forEach(res => {
                if (res.status === "success" && res.records) {
                  allRecords = allRecords.concat(res.records);
                }
              });

              const normalizedRecords = processRecordsFromSheet(allRecords);
              const ogRecords = normalizedRecords.filter(r => r.id && r.id.toString().toUpperCase().startsWith("OG-")).map(r => ({...r, sectorCode: "og"}));
              
              const newOthers = {};
              SECTORS_LIST.forEach(s => {
                if (s.id !== "og") {
                  newOthers[s.id] = normalizedRecords.filter(r => r.id && r.id.toString().toUpperCase().startsWith(`${s.id.toUpperCase()}-`)).map(r => ({...r, sectorCode: s.id}));
                }
              });

              setSessionData(prev => ({
                ...prev,
                [activeCacheKey]: {
                  og: ogRecords,
                  others: newOthers
                }
              }));
              addLog(`[AUTO-SYNC] Berjaya memuatkan ${allRecords.length} rekod milik Pegawai ${officerName}.`, "success");
            } else {
              addLog(`[AUTO-SYNC] Tiada draf mesyuarat dijumpai untuk helaian anda. Bersedia untuk pendaftaran baru.`, "info");
              setSessionData(prev => ({
                ...prev,
                [activeCacheKey]: {
                  og: [],
                  others: {}
                }
              }));
            }
          }
        } catch (err) {
          addLog(`[AUTO-SYNC] Sambungan ke awan gagal: ${err.message}`, "error");
        }
      }

          action: () => executeDeleteItem(id)
        });

      function executeDeleteItem(id) {
        setSessionData(prev => {
          const currentSlice = prev[activeCacheKey] || { og: [], others: {} };
          const currentOg = currentSlice.og || [];
          const currentOthers = currentSlice.others || {};

          let updatedOg = [...currentOg];
          let updatedOthers = { ...currentOthers };
          
          let itemSector = activeSector;
          const ogItem = currentOg.find(item => String(item.id) === String(id));
          if (!ogItem) {
            Object.keys(currentOthers).forEach(sec => {
              if ((currentOthers[sec] || []).find(item => String(item.id) === String(id))) itemSector = sec;
            });
          } else {
            itemSector = "og";
          }

          let listToSync = [];
          if (itemSector === "og") {
            updatedOg = currentOg.filter(item => String(item.id) !== String(id)).map((item, i) => ({ ...item, bil: i + 1 }));
            listToSync = updatedOg;
          } else {
            updatedOthers[itemSector] = (currentOthers[itemSector] || []).filter(item => String(item.id) !== String(id)).map((item, i) => ({ ...item, bil: i + 1 }));
            listToSync = updatedOthers[itemSector];

            setTimeout(() => {
              syncEditRowToGoogleSheets({ id: null, namaSyarikat: "Penyusunan Semula Data (Pemadaman)" }, listToSync, itemSector);
            }, 0);
          }

          return {
            ...prev,
            [activeCacheKey]: {
              og: updatedOg,
              others: updatedOthers
            }
          };

          if (editingPenyandangIndex !== null) {
            updatedPenyandang[editingPenyandangIndex] = newPenyandang;
          } else {
            updatedPenyandang.push(newPenyandang);
          }
          const { valB, valWN } = calculateBAndWN(updatedPenyandang);
          return {
            ...prev,
            penyandang: updatedPenyandang,
            valB,
            valWN
          };
        });
        setNewPenyandang({
          nama: "", jantina: "L", warganegara: "", pasport: "", tarikhLahir: "", umur: "", jawatan: "", gaji: ""

                        value={newCompany.tempohMohon}
                        onChange={(e) => setNewCompany({...newCompany, tempohMohon: e.target.value.toUpperCase()})}
                        className="bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-xs text-slate-800 font-bold uppercase"
                      />
                    </div>
                  </div>

                  <div className="border-t border-slate-200 pt-4 mt-2 flex flex-col gap-3">
                    <span className="text-xs font-bold text-blue-955 uppercase tracking-wider">
                      Maklumat Pemohon (Penyandang)
                    </span>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
                      <div className="flex flex-col gap-1">
                        <span className="text-[10px] text-slate-500 font-bold">Nama Penuh</span>
                        <input
                          type="text"
                          placeholder="Nama pemohon"
                          value={newPenyandang.nama}
                          onChange={(e) => setNewPenyandang({...newPenyandang, nama: e.target.value.toUpperCase()})}
                          className="bg-white border border-slate-300 rounded px-2.5 py-1.5 text-xs font-bold uppercase"
                        />
                      </div>
                      <div className="flex flex-col gap-1">
                        <span className="text-[10px] text-slate-500 font-bold">Jawatan</span>
                        <input
                          type="text"
                          placeholder="Jawatan"
                          value={newPenyandang.jawatan}
                          onChange={(e) => setNewPenyandang({...newPenyandang, jawatan: e.target.value.toUpperCase()})}
                          className="bg-white border border-slate-300 rounded px-2.5 py-1.5 text-xs uppercase"
                        />
                      </div>
                      <div className="flex flex-col gap-1">
                        <span className="text-[10px] text-slate-500 font-bold">Gaji Bulanan</span>
                        <input
                          type="text"
                          placeholder="Contoh: RM15,000"
                          value={newPenyandang.gaji}
                          onChange={(e) => setNewPenyandang({...newPenyandang, gaji: e.target.value.toUpperCase()})}
                          className="bg-white border border-slate-300 rounded px-2.5 py-1.5 text-xs font-bold uppercase"
                        />
                      </div>
                      <div className="flex flex-col gap-1">
                        <span className="text-[10px] text-slate-500 font-bold">No. Pasport</span>
                        <input
                          type="text"
                          placeholder="No. Pasport"
                          value={newPenyandang.pasport}
                          onChange={(e) => setNewPenyandang({...newPenyandang, pasport: e.target.value.toUpperCase()})}
                          className="bg-white border border-slate-300 rounded px-2.5 py-1.5 text-xs uppercase"
                        />
                      </div>
                      <div className="flex flex-col gap-1">
                        <span className="text-[10px] text-slate-500 font-bold">Tarikh Lahir</span>
                        <input
                          type="date"
                          value={newPenyandang.tarikhLahir}
                          onChange={(e) => handleBirthDateChange(e.target.value)}
                          className="bg-white border border-slate-300 rounded px-2.5 py-1.5 text-xs font-bold"
                        />
                      </div>
                      <div className="flex flex-col gap-1">
                        <span className="text-[10px] text-slate-500 font-bold">Warganegara (Kod Tiga Huruf)</span>
                        <input
                          type="text"
                          placeholder="Contoh: MYS"
                          value={newPenyandang.warganegara}
                          onChange={(e) => setNewPenyandang({...newPenyandang, warganegara: e.target.value.toUpperCase()})}
                          className="bg-white border border-slate-300 rounded px-2.5 py-1.5 text-xs font-bold uppercase"
                        />
                      </div>
                      <div className="flex flex-col gap-1">
                        <span className="text-[10px] text-slate-500 font-bold">Umur</span>
                        <input
                          type="text"
                          placeholder="Contoh: 38 THN"
                          value={newPenyandang.umur}
                          onChange={(e) => setNewPenyandang({...newPenyandang, umur: e.target.value.toUpperCase()})}
                          className="bg-white border border-slate-300 rounded px-2.5 py-1.5 text-xs font-bold uppercase"
                        />
                      </div>
                      <div className="flex flex-col gap-1">
                        <span className="text-[10px] text-slate-500 font-bold">Jantina</span>
                        <select
                          value={newPenyandang.jantina}
                          onChange={(e) => setNewPenyandang({...newPenyandang, jantina: e.target.value})}
                          className="bg-white border border-slate-300 rounded px-2.5 py-1.5 text-xs font-bold"
                        >
                          <option value="L">Lelaki</option>
                          <option value="P">Perempuan</option>
                        </select>
                      </div>

                      <div className="md:col-span-4 mt-2">
                        <button
                          type="button"
                          onClick={addPenyandangToNewCompany}
                          className="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold py-2.5 rounded text-xs border border-blue-900 shadow-sm transition-colors"
                        >
                          + Masukkan Penyandang Ini
                        </button>
                      </div>
                    </div>

                    {newCompany.penyandang.length > 0 && (
                      <div className="flex flex-col gap-2 bg-slate-50 p-3 rounded-lg border border-slate-200 max-h-32 overflow-y-auto">
                        {newCompany.penyandang.map((p, idx) => {
                          const norm = normalizePenyandang(p);
                          return (
                            <div key={idx} className="flex items-center justify-between text-xs border-b border-slate-200 pb-1.5 last:border-0 last:pb-0">
                              <span>{idx + 1}. <strong>{norm.nama}</strong> ({norm.jawatan || "N/A"} • {norm.gaji || "N/A"} • Pasport: {norm.pasport || "-"} • WN: {norm.warganegara || "-"})</span>
                              <button
                                type="button"
                                onClick={() => removePenyandangFromNewCompany(idx)}
                                className="text-red-600 hover:text-red-800 font-bold text-[10px]"
                              >
                                Padam
                              </button>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>

                  <div className="flex items-center justify-end gap-3 border-t border-slate-200 pt-4 mt-4">
                    <button type="button" onClick={() => setShowAddModal(false)} className="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-4 py-2 rounded-lg">Batal</button>
                    <button type="submit" disabled={newCompany.penyandang.length === 0} className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-5 py-2.5 rounded-lg shadow-sm disabled:opacity-50">Simpan Permohonan</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {showArchiveModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-white border border-slate-200 rounded-2xl w-full max-w-md p-6 shadow-2xl flex flex-col gap-4">
                <div className="flex items-center justify-between border-b border-slate-200 pb-3">
                  <h3 className="text-sm font-bold text-blue-955 flex items-center gap-1.5">
                    <Icon name="database" size={18} className="text-blue-900" /> Helaian Arkib Anda ({officerName})
                  </h3>
                  <button onClick={() => setShowArchiveModal(false)} className="text-slate-400 hover:text-slate-600 text-xs font-bold">Tutup</button>
                </div>
                <p className="text-[11px] text-slate-600">Sistem hanya memaparkan helaian yang telah didaftarkan di bawah nama pegawai anda bagi mengelakkan pertindihan data rakan sekerja.</p>

                <div className="flex-1 max-h-60 overflow-y-auto border border-slate-200 rounded-xl divide-y divide-slate-150">
                  {filteredPastSheets.length === 0 ? (
                    <div className="p-4 text-center text-[11px] text-slate-400 italic">Tiada helaian lampau dijumpai untuk pegawai ini.</div>
                  ) : (
                    filteredPastSheets.map((shName, idx) => (
                      <div
                        key={idx}
                        onClick={() => loadPastSheetData(shName)}
                        className="p-3 hover:bg-slate-50 cursor-pointer flex items-center justify-between transition-colors group"
                      >
                        <span className="text-xs font-bold text-slate-700 group-hover:text-blue-900">{shName}</span>
                        <span className="text-[10px] text-blue-900 font-semibold bg-blue-50 px-2 py-0.5 rounded border border-blue-100">Buka Helaian</span>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          <footer className="bg-blue-955 text-slate-400 text-[10px] font-semibold tracking-wider text-center py-4 border-t-2 border-amber-500 mt-auto no-print">
            SISTEM KEPUTUSAN JAWATANKUASA PAS LAWATAN IKHTISAS (JKPLIK) &copy; {meetingYear} MALAYSIA. SESI SELAMAT: {officerName}.
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
